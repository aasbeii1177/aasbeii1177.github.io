<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Admin Portal - Tawelty</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        /* --- PREMIUM ADMIN THEME --- */
        body { font-family: 'Plus Jakarta Sans', sans-serif; background: #EEF2F5; margin: 0; padding: 40px 20px; color: #333; }
        .container { max-width: 600px; margin: 0 auto; background: white; padding: 40px; border-radius: 20px; box-shadow: 0 15px 40px rgba(0,0,0,0.08); }

        h1, h2, h3 { color: #1a1a1a; margin-top: 0; font-weight: 700; text-align: center; }
        
        .section-title { font-size: 14px; font-weight: 800; color: #D4AF37; text-transform: uppercase; letter-spacing: 1px; margin-top: 30px; border-bottom: 2px solid #f0f0f0; padding-bottom: 10px; margin-bottom: 15px; }

        label { font-size: 12px; font-weight: 700; color: #95A5A6; display: block; margin-bottom: 5px; margin-top: 15px; }
        input, select { width: 100%; padding: 12px; border: 2px solid #eee; border-radius: 8px; box-sizing: border-box; font-size: 15px; transition: 0.3s; background:white; }
        input:focus, select:focus { border-color: #D4AF37; outline: none; background: #fafafa; }
        
        .btn-primary { width: 100%; padding: 16px; background: #1a1a1a; color: white; border: none; border-radius: 10px; font-size: 16px; font-weight: 600; cursor: pointer; margin-top: 30px; transition: 0.2s; }
        .btn-primary:hover { background: #D4AF37; transform: translateY(-2px); }

        .btn-cancel { width: 100%; padding: 10px; background: #fff; border: 1px solid #ccc; color: #666; border-radius: 10px; cursor: pointer; margin-top: 10px; display: none; }
        .btn-logout { background: none; border: none; color: #95A5A6; font-size: 14px; cursor: pointer; text-decoration: underline; margin-top: 20px; width: 100%; }

        /* LIST STYLES */
        .res-list { margin-top: 40px; border-top: 2px dashed #eee; padding-top: 20px; }
        .res-item { display: flex; justify-content: space-between; align-items: center; padding: 15px; border-bottom: 1px solid #f0f0f0; }
        .res-info { flex-grow: 1; }
        .res-name { font-weight: 600; font-size: 16px; }
        .res-meta { font-size: 12px; color: #999; margin-top: 2px; }
        
        .btn-action { border: none; padding: 8px 12px; border-radius: 6px; cursor: pointer; font-size: 14px; margin-left: 5px; }
        .btn-delete { background: #fee; color: #e74c3c; }
        .btn-edit { background: #eef2f5; color: #2980b9; }
        .btn-qr { background: #e8f6f3; color: #1abc9c; } 

        #qr-modal { display: none; position: fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.5); z-index:999; justify-content:center; align-items:center; }
        .qr-box { background:white; padding:30px; border-radius:15px; text-align:center; max-width:300px; }
        .qr-img { width: 200px; height: 200px; margin-bottom: 15px; }

        .success-msg { background: #d4edda; color: #155724; padding: 15px; border-radius: 8px; text-align: center; margin-top: 20px; display: none; }
        .loader { border: 3px solid #f3f3f3; border-top: 3px solid #D4AF37; border-radius: 50%; width: 20px; height: 20px; animation: spin 1s linear infinite; display: inline-block; vertical-align: middle; margin-right: 10px; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        .hidden { display: none; }
        .error { color: #e74c3c; text-align: center; margin-top: 15px; font-size: 14px; }
    </style>
</head>
<body>

    <div id="login-section" class="container">
        <h2>Admin Access</h2>
        <input type="email" id="email" placeholder="Admin Email" style="margin-top:20px;">
        <input type="password" id="password" placeholder="Password" style="margin-top:15px;">
        <button class="btn-primary" onclick="login()">Enter Portal</button>
        <p id="login-error" class="error hidden"></p>
    </div>

    <div id="dashboard-section" class="container hidden">
        <h2 id="form-title" style="margin-bottom: 10px;">Setup New Venue</h2>
        
        <div class="section-title">1. Restaurant Details</div>
        <label>Name</label><input type="text" id="res-name" placeholder="e.g. Naranj">
        <label>Location</label><input type="text" id="res-location" placeholder="e.g. Old Damascus">
        <label>Image Link</label><input type="text" id="res-image" placeholder="https://...">
        
        <div style="display:flex; gap:10px;">
            <div style="flex:1;">
                <label>Cuisine</label>
                <input type="text" id="res-cuisine" placeholder="e.g. Syrian">
            </div>
            <div style="flex:1;">
                <label>Price Range</label>
                <select id="res-price">
                    <option value="$">Low ($)</option>
                    <option value="$$" selected>Medium ($$)</option>
                    <option value="$$$">High ($$$)</option>
                </select>
            </div>
        </div>

        <label>Max Guests Per Hour (Capacity)</label>
        <input type="number" id="res-capacity" placeholder="e.g. 20">

        <div id="manager-section">
            <div class="section-title">2. Manager Login</div>
            <label>Manager Email</label><input type="email" id="mgr-email" placeholder="manager@naranj.com">
            <label>Manager Password</label><input type="text" id="mgr-pass" placeholder="Create a password">
        </div>

        <button id="btn-submit" class="btn-primary" onclick="handleSubmit()">+ Create Everything</button>
        <button id="btn-cancel" class="btn-cancel" onclick="cancelEdit()">Cancel Edit</button>
        
        <div id="msg" class="success-msg">✨ Success!</div>

        <div class="res-list">
            <h3>Manage Venues</h3>
            <div id="restaurants-container">
                <p style="text-align:center; color:#ccc;">Loading list...</p>
            </div>
        </div>

        <button class="btn-logout" onclick="logout()">Logout</button>
    </div>

    <div id="qr-modal" onclick="closeQr()">
        <div class="qr-box" onclick="event.stopPropagation()">
            <h3 id="qr-title" style="margin-bottom:15px;"></h3>
            <img id="qr-image" class="qr-img" src="">
            <p style="font-size:12px; color:#999;">Right-click to save</p>
            <button onclick="closeQr()" style="margin-top:10px; padding:5px 15px; border:1px solid #ddd; background:white; border-radius:5px; cursor:pointer;">Close</button>
        </div>
    </div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged, createUserWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
    import { getFirestore, collection, addDoc, doc, setDoc, getDocs, deleteDoc, updateDoc, query, where } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyCIYCI18z3R0ViAQ0IRofZP9b6bjxZFCOw",
      authDomain: "tawelty-realtime.firebaseapp.com",
      projectId: "tawelty-realtime",
      storageBucket: "tawelty-realtime.firebasestorage.app",
      messagingSenderId: "127610217841",
      appId: "1:127610217841:web:9535aedf4a06c645c9c2d0"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    let editingId = null;
    let editingOldName = "";

    window.login = () => {
        const email = document.getElementById('email').value;
        const pass = document.getElementById('password').value;
        signInWithEmailAndPassword(auth, email, pass).catch((error) => {
            document.getElementById('login-error').innerText = error.message;
            document.getElementById('login-error').classList.remove('hidden');
        });
    };

    window.logout = () => signOut(auth).then(() => window.location.href = "index.html");

    onAuthStateChanged(auth, (user) => {
        if (user) {
            document.getElementById('login-section').classList.add('hidden');
            document.getElementById('dashboard-section').classList.remove('hidden');
            loadRestaurants();
        } else {
            document.getElementById('login-section').classList.remove('hidden');
            document.getElementById('dashboard-section').classList.add('hidden');
        }
    });

    window.handleSubmit = async () => {
        if (editingId) updateRestaurant();
        else createRestaurant();
    }

    async function createRestaurant() {
        const rName = document.getElementById('res-name').value;
        const rLoc = document.getElementById('res-location').value;
        const rImg = document.getElementById('res-image').value;
        const rCap = document.getElementById('res-capacity').value;
        const rCus = document.getElementById('res-cuisine').value || "General"; // NEW
        const rPri = document.getElementById('res-price').value || "$$"; // NEW
        
        const mEmail = document.getElementById('mgr-email').value;
        const mPass = document.getElementById('mgr-pass').value;
        const btn = document.getElementById('btn-submit');

        if(!rName || !rLoc || !mEmail || !mPass || !rCap) return alert("Please fill all fields.");

        btn.innerHTML = '<div class="loader"></div> Creating...';
        btn.disabled = true;

        try {
            await addDoc(collection(db, "restaurants"), { 
                name: rName, 
                location: rLoc, 
                image: rImg || 'https://via.placeholder.com/400x300',
                capacity: parseInt(rCap),
                cuisine: rCus, // Save
                price: rPri    // Save
            });
            
            const secondaryApp = initializeApp(firebaseConfig, "Secondary");
            const secondaryAuth = getAuth(secondaryApp);
            await createUserWithEmailAndPassword(secondaryAuth, mEmail, mPass);
            await setDoc(doc(db, "managers", mEmail), { restaurant: rName, createdAt: new Date() });

            showSuccess("✨ Created Successfully!");
            clearInputs();
            loadRestaurants();
        } catch (e) { alert("Error: " + e.message); } 
        finally { btn.innerHTML = '+ Create Everything'; btn.disabled = false; }
    }

    async function updateRestaurant() {
        const rName = document.getElementById('res-name').value;
        const rLoc = document.getElementById('res-location').value;
        const rImg = document.getElementById('res-image').value;
        const rCap = document.getElementById('res-capacity').value;
        const rCus = document.getElementById('res-cuisine').value; // NEW
        const rPri = document.getElementById('res-price').value; // NEW
        const btn = document.getElementById('btn-submit');

        if(!rName || !rLoc || !rCap) return alert("All fields required.");

        btn.innerHTML = '<div class="loader"></div> Updating...';
        btn.disabled = true;

        try {
            const resRef = doc(db, "restaurants", editingId);
            await updateDoc(resRef, { 
                name: rName, 
                location: rLoc, 
                image: rImg,
                capacity: parseInt(rCap),
                cuisine: rCus, // Update
                price: rPri    // Update
            });

            if (rName !== editingOldName) {
                const q = query(collection(db, "managers"), where("restaurant", "==", editingOldName));
                const querySnapshot = await getDocs(q);
                querySnapshot.forEach(async (docSnap) => {
                    await updateDoc(doc(db, "managers", docSnap.id), { restaurant: rName });
                });
            }

            showSuccess("✏️ Updated!");
            cancelEdit();
            loadRestaurants();
        } catch (e) { alert("Error: " + e.message); } 
        finally { btn.disabled = false; }
    }

    window.loadRestaurants = async () => {
        const container = document.getElementById('restaurants-container');
        container.innerHTML = '<div class="loader"></div>';
        try {
            const resSnap = await getDocs(collection(db, "restaurants"));
            const mgrSnap = await getDocs(collection(db, "managers"));
            let mgrMap = {}; 
            mgrSnap.forEach(doc => { mgrMap[doc.data().restaurant] = doc.id; });

            if(resSnap.empty) { container.innerHTML = '<p style="text-align:center;">No venues found.</p>'; return; }
            
            let html = '';
            resSnap.forEach((doc) => {
                const d = doc.data();
                const safeName = d.name.replace(/'/g, "\\'"); 
                const safeLoc = d.location.replace(/'/g, "\\'");
                const safeImg = d.image ? d.image.replace(/'/g, "\\'") : '';
                const safeCap = d.capacity || 20; 
                const safeCus = d.cuisine || "General"; // Default
                const safePri = d.price || "$$"; // Default

                const mgrEmail = mgrMap[d.name] || "No Manager Linked";

                html += `
                <div class="res-item">
                    <div class="res-info">
                        <div class="res-name">${d.name}</div>
                        <div class="res-meta">${d.location} | ${safeCus} | ${safePri}</div>
                        <div class="res-meta">👤 ${mgrEmail}</div>
                    </div>
                    <div>
                        <button class="btn-action btn-qr" onclick="showQr('${safeName}')">📱</button>
                        <button class="btn-action btn-edit" onclick="startEdit('${doc.id}', '${safeName}', '${safeLoc}', '${safeImg}', ${safeCap}, '${safeCus}', '${safePri}')">✏️</button>
                        <button class="btn-action btn-delete" onclick="deleteRestaurant('${doc.id}', '${safeName}')">🗑️</button>
                    </div>
                </div>`;
            });
            container.innerHTML = html;
        } catch(e) { console.error(e); }
    }

    window.showQr = (name) => {
        const modal = document.getElementById('qr-modal');
        const img = document.getElementById('qr-image');
        const title = document.getElementById('qr-title');
        const websiteUrl = "https://taweltysy.com"; 
        img.src = `https://api.qrserver.com/v1/create-qr-code/?size=200x200&data=${encodeURIComponent(websiteUrl)}`;
        title.innerText = name + " QR";
        modal.style.display = 'flex';
    };
    
    window.closeQr = () => document.getElementById('qr-modal').style.display = 'none';

    window.startEdit = (id, name, loc, img, cap, cus, pri) => {
        editingId = id;
        editingOldName = name;
        document.getElementById('res-name').value = name;
        document.getElementById('res-location').value = loc;
        document.getElementById('res-image').value = img;
        document.getElementById('res-capacity').value = cap;
        document.getElementById('res-cuisine').value = cus; // Fill
        document.getElementById('res-price').value = pri; // Fill
        
        document.getElementById('form-title').innerText = "Edit Venue";
        document.getElementById('btn-submit').innerText = "Save Changes";
        document.getElementById('manager-section').style.display = 'none'; 
        document.getElementById('btn-cancel').style.display = 'block';
        window.scrollTo(0,0);
    }

    window.cancelEdit = () => {
        editingId = null;
        editingOldName = "";
        clearInputs();
        document.getElementById('form-title').innerText = "Setup New Venue";
        document.getElementById('btn-submit').innerText = "+ Create Everything";
        document.getElementById('manager-section').style.display = 'block';
        document.getElementById('btn-cancel').style.display = 'none';
    }

    window.deleteRestaurant = async (id, name) => {
        if(confirm(`Delete ${name}?`)) {
            await deleteDoc(doc(db, "restaurants", id));
            loadRestaurants();
        }
    };

    function showSuccess(msgText) {
        const msg = document.getElementById('msg');
        msg.innerText = msgText;
        msg.style.display = 'block';
        setTimeout(() => msg.style.display = 'none', 3000);
    }

    function clearInputs() {
        document.getElementById('res-name').value = "";
        document.getElementById('res-location').value = "";
        document.getElementById('res-image').value = "";
        document.getElementById('res-capacity').value = "";
        document.getElementById('res-cuisine').value = "";
        document.getElementById('res-price').value = "$$";
        document.getElementById('mgr-email').value = "";
        document.getElementById('mgr-pass').value = "";
    }
</script>
</body>
</html>
