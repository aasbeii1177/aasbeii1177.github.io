<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tawelty Admin</title>
    <link href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Lato', sans-serif; background-color: #f4f4f4; padding: 20px; }
        .container { max-width: 500px; margin: 0 auto; background: white; padding: 30px; border-radius: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        h2 { text-align: center; color: #5D4037; }
        input, button { width: 100%; padding: 10px; margin-bottom: 15px; border-radius: 5px; border: 1px solid #ddd; box-sizing: border-box; }
        button { background-color: #5D4037; color: white; border: none; cursor: pointer; font-weight: bold; }
        button:hover { background-color: #3E2723; }
        .hidden { display: none; }
        .success { color: green; text-align: center; display: none; }
    </style>
</head>
<body>

    <div class="container" id="login-section">
        <h2>🔒 Admin Login</h2>
        <input type="email" id="email" placeholder="Admin Email">
        <input type="password" id="password" placeholder="Password">
        <button onclick="login()">Login</button>
    </div>

    <div class="container hidden" id="dashboard-section">
        <h2>➕ Add New Restaurant</h2>
        <input type="text" id="res-name" placeholder="Restaurant Name (e.g., Askim)">
        <input type="text" id="res-location" placeholder="Location (e.g., Malki)">
        <input type="text" id="res-image" placeholder="Image Link (https://...)">
        <button onclick="addRestaurant()">Add to Database</button>
        <p id="msg" class="success">✅ Restaurant Added!</p>
        <button onclick="logout()" style="background-color: #999; margin-top:10px;">Logout</button>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { getFirestore, collection, addDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        // --- 1. PASTE YOUR CONFIG HERE ---
       const firebaseConfig = {
  apiKey: "AIzaSyCIYCI18z3R0ViAQ0IRofZP9b6bjxZFCOw",
  authDomain: "tawelty-realtime.firebaseapp.com",
  projectId: "tawelty-realtime",
  storageBucket: "tawelty-realtime.firebasestorage.app",
  messagingSenderId: "127610217841",
  appId: "1:127610217841:web:9535aedf4a06c645c9c2d0"
};

        // Initialize Firebase
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        // --- LOGIN LOGIC ---
        window.login = () => {
            const email = document.getElementById('email').value;
            const pass = document.getElementById('password').value;
            signInWithEmailAndPassword(auth, email, pass)
                .catch((error) => alert("Error: " + error.message));
        };

window.logout = () => {
    signOut(auth).then(() => {
        window.location.href = "index.html"; // Go back to main site
    });
};

        // --- MONITOR LOGIN STATUS ---
        onAuthStateChanged(auth, (user) => {
            if (user) {
                document.getElementById('login-section').classList.add('hidden');
                document.getElementById('dashboard-section').classList.remove('hidden');
            } else {
                document.getElementById('login-section').classList.remove('hidden');
                document.getElementById('dashboard-section').classList.add('hidden');
            }
        });

        // --- ADD RESTAURANT LOGIC ---
        window.addRestaurant = async () => {
            const name = document.getElementById('res-name').value;
            const loc = document.getElementById('res-location').value;
            const img = document.getElementById('res-image').value;

            if(!name || !loc) return alert("Please fill details");

            try {
                await addDoc(collection(db, "restaurants"), {
                    name: name,
                    location: loc,
                    image: img
                });
                document.getElementById('msg').style.display = 'block';
                // Clear inputs
                document.getElementById('res-name').value = "";
                document.getElementById('res-location').value = "";
                setTimeout(() => document.getElementById('msg').style.display = 'none', 3000);
            } catch (e) {
                alert("Error adding document: " + e.message);
            }
        };
    </script>
</body>
</html>
