<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Admin Portal - Tawelty</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        /* --- PREMIUM ADMIN THEME --- */
        body { font-family: 'Plus Jakarta Sans', sans-serif; background: #EEF2F5; margin: 0; padding: 40px 20px; color: #333; }
        .container { max-width: 500px; margin: 0 auto; background: white; padding: 40px; border-radius: 20px; box-shadow: 0 15px 40px rgba(0,0,0,0.08); }

        h1, h2 { color: #1a1a1a; margin-top: 0; font-weight: 700; text-align: center; }
        
        /* Form Styling */
        label { font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: 1px; color: #95A5A6; display: block; margin-bottom: 8px; margin-top: 20px; }
        input { width: 100%; padding: 15px; border: 2px solid #eee; border-radius: 10px; box-sizing: border-box; font-size: 16px; transition: 0.3s; }
        input:focus { border-color: #D4AF37; outline: none; background: #fafafa; }
        
        /* Buttons */
        .btn-primary { 
            width: 100%; padding: 16px; background: #1a1a1a; color: white; 
            border: none; border-radius: 10px; font-size: 16px; font-weight: 600; 
            cursor: pointer; margin-top: 30px; transition: 0.2s; 
        }
        .btn-primary:hover { background: #D4AF37; transform: translateY(-2px); }

        .btn-logout {
            background: none; border: none; color: #95A5A6; font-size: 14px; 
            cursor: pointer; text-decoration: underline; margin-top: 20px; width: 100%;
        }
        .btn-logout:hover { color: #e74c3c; }

        /* Success Message */
        .success-msg { 
            background: #d4edda; color: #155724; padding: 15px; border-radius: 8px; 
            text-align: center; margin-top: 20px; display: none; border: 1px solid #c3e6cb;
        }

        .hidden { display: none; }
        .error { color: #e74c3c; text-align: center; margin-top: 15px; font-size: 14px; }
    </style>
</head>
<body>

    <div id="login-section" class="container">
        <h2>Admin Access</h2>
        <p style="text-align:center; color:#888; margin-bottom:30px;">Authorized Personnel Only</p>
        
        <input type="email" id="email" placeholder="Admin Email">
        <div style="height:15px;"></div>
        <input type="password" id="password" placeholder="Password">
        
        <button class="btn-primary" onclick="login()">Enter Portal</button>
        <p id="login-error" class="error hidden"></p>
    </div>

    <div id="dashboard-section" class="container hidden">
        <h2 style="border-bottom: 2px solid #f0f0f0; padding-bottom: 20px;">Add Venue</h2>
        
        <label>Restaurant Name</label>
        <input type="text" id="res-name" placeholder="e.g. Naranj">
        
        <label>Location</label>
        <input type="text" id="res-location" placeholder="e.g. Old Damascus">
        
        <label>Image Link (URL)</label>
        <input type="text" id="res-image" placeholder="https://...">

        <button class="btn-primary" onclick="addRestaurant()">+ Add to Database</button>
        
        <div id="msg" class="success-msg">✨ Restaurant Added Successfully!</div>
        <button class="btn-logout" onclick="logout()">Logout</button>
    </div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
    import { getFirestore, collection, addDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

    // --- YOUR KEYS ARE PRE-FILLED HERE ---
    const firebaseConfig = {
      apiKey: "AIzaSyCIYCI18z3R0ViAQ0IRofZP9b6bjxZFCOw",
      authDomain: "tawelty-realtime.firebaseapp.com",
      projectId: "tawelty-realtime",
      storageBucket: "tawelty-realtime.firebasestorage.app",
      messagingSenderId: "127610217841",
      appId: "1:127610217841:web:9535aedf4a06c645c9c2d0"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    // --- CHANGE THIS TO YOUR REAL ADMIN EMAIL ---
    const adminEmail = "admin@tawelty.com";

    // --- LOGIN LOGIC ---
    window.login = () => {
        const email = document.getElementById('email').value;
        const pass = document.getElementById('password').value;
        signInWithEmailAndPassword(auth, email, pass)
            .catch((error) => {
                document.getElementById('login-error').innerText = "Error: " + error.message;
                document.getElementById('login-error').classList.remove('hidden');
            });
    };

    // --- LOGOUT LOGIC (Local Fix) ---
    window.logout = () => {
        signOut(auth).then(() => {
            window.location.href = "index.html";
        });
    };

    // --- SECURITY CHECK ---
    onAuthStateChanged(auth, (user) => {
        if (user) {
            // Optional: You can enforce email checking here if you want extra security
            // if (user.email !== adminEmail) { alert("Not Authorized"); signOut(auth); return; }
            
            document.getElementById('login-section').classList.add('hidden');
            document.getElementById('dashboard-section').classList.remove('hidden');
        } else {
            document.getElementById('login-section').classList.remove('hidden');
            document.getElementById('dashboard-section').classList.add('hidden');
        }
    });

    // --- ADD RESTAURANT LOGIC ---
    window.addRestaurant = async () => {
        const name = document.getElementById('res-name').value;
        const loc = document.getElementById('res-location').value;
        const img = document.getElementById('res-image').value;

        if(!name || !loc) return alert("Please fill in Name and Location");

        try {
            await addDoc(collection(db, "restaurants"), {
                name: name,
                location: loc,
                image: img || 'https://via.placeholder.com/400x300' // Default image if empty
            });
            
            // Show Success Message
            document.getElementById('msg').style.display = 'block';
            
            // Clear inputs
            document.getElementById('res-name').value = "";
            document.getElementById('res-location').value = "";
            document.getElementById('res-image').value = "";
            
            // Hide message after 3 seconds
            setTimeout(() => document.getElementById('msg').style.display = 'none', 3000);
            
        } catch (e) {
            alert("Error: " + e.message);
        }
    };
</script>
</body>
</html>
