<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Manager Cockpit - Tawelty</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600&family=Plus+Jakarta+Sans:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        /* --- LUXURY COCKPIT THEME --- */
        :root { 
            --bg: #121212; 
            --card-bg: #1E1E1E; 
            --text: #FFFFFF; 
            --text-muted: #888888;
            --gold: #D4AF37; 
            --gold-glow: rgba(212, 175, 55, 0.3);
            --danger: #CF6679;
            --success: #03DAC6;
        }

        body { font-family: 'Plus Jakarta Sans', sans-serif; background: var(--bg); color: var(--text); margin: 0; padding: 20px; }
        .container { max-width: 900px; margin: 0 auto; }
        
        h1, h2, h3 { font-family: 'Playfair Display', serif; color: var(--text); margin: 0; }
        
        /* HEADER SECTION */
        .dashboard-header { 
            display: flex; justify-content: space-between; align-items: center; 
            margin-bottom: 30px; padding-bottom: 20px; border-bottom: 1px solid #333;
        }
        #manager-title { font-size: 1.8rem; color: var(--gold); text-shadow: 0 0 20px var(--gold-glow); }
        
        /* STATS BAR (The "Cockpit") */
        .stats-bar {
            display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-bottom: 30px;
        }
        .stat-card {
            background: linear-gradient(145deg, #252525, #1a1a1a);
            padding: 20px; border-radius: 16px; border: 1px solid #333;
            text-align: center; position: relative; overflow: hidden;
        }
        .stat-card::after { content:''; position:absolute; top:0; left:0; width:100%; height:4px; background: var(--gold); }
        
        .stat-val { font-size: 2.5rem; font-weight: 700; color: white; display: block; line-height: 1; margin-bottom: 5px; }
        .stat-label { font-size: 0.8rem; text-transform: uppercase; letter-spacing: 2px; color: var(--gold); }
        .stat-sub { font-size: 0.9rem; color: #666; margin-top: 5px; }

        .time-display { 
            grid-column: 1 / -1; background: #000; color: var(--gold); 
            padding: 10px; border-radius: 8px; text-align: center; 
            font-family: 'Courier New', monospace; letter-spacing: 1px; font-weight: bold;
            border: 1px solid #333;
        }

        /* CONTROLS */
        .controls { display: flex; gap: 15px; margin-bottom: 20px; }
        .btn-main { 
            flex: 1; padding: 15px; border: none; border-radius: 12px; 
            font-weight: 700; cursor: pointer; transition: 0.2s; font-size: 1rem;
            background: var(--gold); color: black; 
        }
        .btn-main:hover { transform: translateY(-2px); box-shadow: 0 5px 20px var(--gold-glow); background: #e5c14f; }
        .btn-logout { background: #333; color: white; border: 1px solid #444; }

        /* BOOKING LIST (Date Headers) */
        .date-header {
            margin: 40px 0 15px 0; padding-left: 10px;
            border-left: 4px solid var(--gold);
            color: var(--text); font-size: 1.2rem; font-family: 'Playfair Display', serif;
        }

        /* BOOKING CARDS (Golden Tickets) */
        .booking-card { 
            background: var(--card-bg); border-radius: 12px; margin-bottom: 15px; padding: 20px;
            display: flex; flex-direction: column; gap: 15px;
            border: 1px solid #333; position: relative;
            transition: 0.2s;
        }
        @media(min-width: 600px) { .booking-card { flex-direction: row; justify-content: space-between; align-items: center; } }
        
        .status-Pending { border-left: 5px solid #F39C12; }
        .status-Accepted { border-left: 5px solid var(--gold); background: linear-gradient(90deg, #1E1E1E 0%, #25231a 100%); }
        .status-Declined { opacity: 0.5; border-left: 5px solid #333; }

        .b-name { font-size: 1.2rem; font-weight: 700; color: white; display: block; margin-bottom: 4px; }
        .b-details { font-size: 0.9rem; color: #aaa; display: flex; gap: 15px; align-items: center; }
        .b-badge { 
            font-size: 0.7rem; padding: 3px 8px; border-radius: 4px; 
            background: #333; color: #fff; text-transform: uppercase; 
        }
        
        .actions { display: flex; gap: 10px; }
        .btn-icon { background: #333; border: 1px solid #444; color: white; padding: 10px; border-radius: 8px; cursor: pointer; }
        .btn-icon:hover { background: var(--gold); color: black; border-color: var(--gold); }

        /* MODAL (Dark Theme) */
        .modal { display: none; position: fixed; z-index: 999; left: 0; top: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); backdrop-filter: blur(5px); justify-content: center; align-items: center; }
        .modal-content { background: #1a1a1a; padding: 30px; border-radius: 15px; width: 90%; max-width: 400px; border: 1px solid #333; color: white; box-shadow: 0 20px 50px rgba(0,0,0,0.5); }
        .input-group { margin-bottom: 15px; }
        .input-group label { display: block; font-size: 11px; font-weight: bold; color: var(--gold); margin-bottom: 5px; text-transform: uppercase; }
        .modal-input { width: 100%; padding: 14px; background: #111; border: 1px solid #333; color: white; border-radius: 8px; box-sizing: border-box; font-family: inherit; }
        .modal-input:focus { border-color: var(--gold); outline: none; }

        /* UTILS */
        .hidden { display: none; }
        #login-view { text-align: center; max-width: 350px; margin: 10vh auto; }
        #bookings-list { padding-bottom: 50px; }
    </style>
</head>
<body>

    <div id="login-view" class="container">
        <h2 style="color:var(--gold); font-size:2rem; margin-bottom:30px;">Manager Portal</h2>
        <input type="email" id="email" class="modal-input" placeholder="Email Address" style="margin-bottom:15px;">
        <input type="password" id="password" class="modal-input" placeholder="Password" style="margin-bottom:20px;">
        <button class="btn-main" onclick="login()">Enter Cockpit</button>
        <p id="login-msg" style="color:var(--danger); margin-top:15px;" class="hidden"></p>
    </div>

    <div id="dashboard-view" class="container hidden">
        <div class="dashboard-header">
            <h2 id="manager-title">Loading...</h2>
            <button class="btn-logout" style="padding:8px 15px; border-radius:8px;" onclick="logout()">Logout</button>
        </div>

        <div class="stats-bar">
            <div class="time-display" id="current-hour-display">--:--</div>
            <div class="stat-card">
                <span class="stat-val" id="live-guests">0</span>
                <span class="stat-sub" id="max-guests">/ 0 Capacity</span>
                <span class="stat-label">Live Guests</span>
            </div>
            <div class="stat-card">
                <span class="stat-val" id="live-tables">0</span>
                <span class="stat-sub" id="max-tables">/ 0 Tables</span>
                <span class="stat-label">Live Tables</span>
            </div>
        </div>

        <div class="controls">
            <button class="btn-main" onclick="openModal('add')">+ New Reservation</button>
        </div>

        <audio id="notif-sound" src="https://assets.mixkit.co/active_storage/sfx/2869/2869-preview.m4a" preload="auto"></audio>

        <div id="bookings-list">
            <p style="text-align:center; color:#555; margin-top:50px;">Connecting to Live Feed...</p>
        </div>
    </div>

    <div id="booking-modal" class="modal">
        <div class="modal-content">
            <h3 id="modal-title" style="margin-top:0; color:var(--gold); margin-bottom:20px;">Add Booking</h3>
            <input type="hidden" id="edit-id"> 

            <div class="input-group">
                <label>Guest Name</label>
                <input type="text" id="m-name" class="modal-input" placeholder="Name">
            </div>
            <div class="input-group">
                <label>Phone</label>
                <input type="text" id="m-phone" class="modal-input" placeholder="Phone">
            </div>
            <div class="input-group" style="display:flex; gap:10px;">
                <div style="flex:1;">
                    <label>Date</label>
                    <input type="date" id="m-date" class="modal-input">
                </div>
                <div style="flex:1;">
                    <label>Time</label>
                    <select id="m-time" class="modal-input"></select>
                </div>
            </div>
            <div class="input-group" style="display:flex; gap:10px;">
                <div style="flex:1;">
                    <label>Guests</label>
                    <input type="number" id="m-guests" class="modal-input" value="2" min="1">
                </div>
                <div style="flex:1;">
                    <label>Duration (Hrs)</label>
                    <input type="number" id="m-duration" class="modal-input" value="3" min="1">
                </div>
            </div>

            <button onclick="saveBooking()" class="btn-main" style="width:100%; margin-top:10px;">Save Booking</button>
            <button onclick="closeModal()" style="width:100%; background:transparent; border:1px solid #444; color:#888; padding:12px; border-radius:8px; margin-top:10px; cursor:pointer;">Cancel</button>
        </div>
    </div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
    import { getFirestore, collection, doc, getDoc, updateDoc, addDoc, query, where, onSnapshot, getDocs } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyCIYCI18z3R0ViAQ0IRofZP9b6bjxZFCOw",
      authDomain: "tawelty-realtime.firebaseapp.com",
      projectId: "tawelty-realtime",
      storageBucket: "tawelty-realtime.firebasestorage.app",
      messagingSenderId: "127610217841",
      appId: "1:127610217841:web:9535aedf4a06c645c9c2d0"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    let currentRestaurant = "";
    let maxGuests = 0;
    let maxTables = 0; 
    let openTime = 12;
    let closeTime = 22;

    let latestSnapshot = null; 
    let unsubscribe = null; 

    window.onload = () => { setInterval(recalculateDashboard, 10000); };

    window.login = () => {
        const email = document.getElementById('email').value;
        const pass = document.getElementById('password').value;
        signInWithEmailAndPassword(auth, email, pass).catch(e => {
            document.getElementById('login-msg').innerText = "Access Failed: " + e.message;
            document.getElementById('login-msg').classList.remove('hidden');
        });
    };
    
    window.logout = () => {
        if(unsubscribe) unsubscribe();
        signOut(auth).then(() => { window.location.href = "index.html"; });
    };

    onAuthStateChanged(auth, async (user) => {
        if (user) {
            document.getElementById('login-view').classList.add('hidden');
            document.getElementById('dashboard-view').classList.remove('hidden');
            try {
                const managerRef = doc(db, "managers", user.email);
                const managerSnap = await getDoc(managerRef);
                if (managerSnap.exists()) {
                    currentRestaurant = managerSnap.data().restaurant;
                    document.getElementById('manager-title').innerText = currentRestaurant;
                    
                    const q = query(collection(db, "restaurants"), where("name", "==", currentRestaurant));
                    const resSnap = await getDocs(q);
                    if(!resSnap.empty) {
                        const d = resSnap.docs[0].data();
                        maxGuests = d.capacity || 20;
                        maxTables = d.tables || 10;
                        openTime = d.openTime || 12;
                        closeTime = d.closeTime || 22;
                        
                        document.getElementById('max-guests').innerText = "/ " + maxGuests + " Capacity";
                        document.getElementById('max-tables').innerText = "/ " + maxTables + " Tables";
                    }
                    startRealtimeListener(); 
                }
            } catch (error) { console.error(error); }
        } else {
            document.getElementById('login-view').classList.remove('hidden');
            document.getElementById('dashboard-view').classList.add('hidden');
        }
    });

    function recalculateDashboard() {
        if (!latestSnapshot) return;
        const now = new Date();
        const currentHour = now.getHours(); 
        const min = now.getMinutes().toString().padStart(2, '0');
        document.getElementById('current-hour-display').innerText = `CLOCK: ${currentHour}:${min}`;

        let liveGuests = 0;
        let liveTables = 0;
        const todayStr = now.toISOString().split('T')[0];

        latestSnapshot.forEach(doc => {
            const data = doc.data();
            if (data.date === todayStr && !data.archived && data.status !== 'Declined') {
                const startHour = parseInt(data.time.split(':')[0]);
                const endHour = startHour + (data.duration || 3);
                if (currentHour >= startHour && currentHour < endHour) {
                    liveGuests += parseInt(data.persons);
                    liveTables += Math.ceil(parseInt(data.persons) / 4);
                }
            }
        });

        const gEl = document.getElementById('live-guests');
        gEl.innerText = liveGuests;
        document.getElementById('live-tables').innerText = liveTables;
        
        // Color Logic: Green (Fine) -> Gold (Busy) -> Red (Full)
        if(liveGuests >= maxGuests) gEl.style.color = "#CF6679"; 
        else if (liveGuests >= maxGuests * 0.8) gEl.style.color = "#D4AF37"; 
        else gEl.style.color = "#03DAC6"; 
    }

    function startRealtimeListener() {
        if(!currentRestaurant) return;
        const list = document.getElementById('bookings-list');
        const sound = document.getElementById('notif-sound');
        const q = query(collection(db, "reservations"), where("restaurant", "==", currentRestaurant));
        let isFirstLoad = true;

        unsubscribe = onSnapshot(q, (snapshot) => {
            latestSnapshot = snapshot; 
            recalculateDashboard();
            if(snapshot.empty) { list.innerHTML = "<p style='text-align:center; color:#555;'>No bookings yet.</p>"; return; }

            if (!isFirstLoad) {
                snapshot.docChanges().forEach((change) => {
                    if (change.type === "added" && !change.doc.data().archived && change.doc.data().source !== "Manager") {
                        sound.currentTime = 0; sound.play().catch(e => {});
                    }
                });
            }
            isFirstLoad = false;

            const allDocs = [];
            snapshot.forEach(doc => { if(!doc.data().archived) allDocs.push({ id: doc.id, ...doc.data() }); });
            
            // SORT
            allDocs.sort((a, b) => {
                if (a.date !== b.date) return a.date.localeCompare(b.date);
                return parseInt(a.time) - parseInt(b.time);
            });

            let html = '';
            let lastDate = null;

            allDocs.forEach(b => {
                // DATE HEADER
                if (b.date !== lastDate) {
                    const dObj = new Date(b.date);
                    const dStr = dObj.toLocaleDateString('en-GB', { weekday:'long', day:'numeric', month:'long' });
                    html += `<div class="date-header">${dStr}</div>`;
                    lastDate = b.date;
                }

                // STATUS BUTTONS
                let buttons = '';
                if(b.status === 'Pending') {
                    buttons = `
                        <button class="btn-icon" style="background:#03DAC6; color:black; border:none;" onclick="handleDecision('${b.id}', '${b.phone}', '${b.name}', 'Accepted')">✔ Accept</button>
                        <button class="btn-icon" style="background:#CF6679; color:black; border:none;" onclick="handleDecision('${b.id}', '${b.phone}', '${b.name}', 'Declined')">✖ Decline</button>
                    `;
                } else {
                    const sColor = b.status === 'Accepted' ? '#D4AF37' : '#555';
                    buttons = `<span style="color:${sColor}; font-weight:bold; margin-right:10px;">${b.status}</span>`;
                }

                const safeName = b.name.replace(/'/g, "\\'");
                const safePhone = (b.phone || "").replace(/'/g, "\\'");

                // EDIT/TRASH BUTTONS
                buttons += `
                    <button class="btn-icon" onclick="openModal('edit', '${b.id}', '${safeName}', '${safePhone}', '${b.date}', '${b.time}', ${b.persons}, ${b.duration||3})">✎</button>
                    <button class="btn-icon" onclick="archiveBooking('${b.id}')">🗑</button>
                `;

                const sourceTag = b.source === "Manager" ? '<span class="b-badge" style="background:#D4AF37; color:black;">STAFF</span>' : '';

                html += `
                <div class="booking-card status-${b.status}">
                    <div>
                        <span class="b-name">${b.name} ${sourceTag}</span>
                        <div class="b-details">
                            <span>🕒 ${b.time}</span>
                            <span>👤 ${b.persons} Guests</span>
                            <span>⏳ ${b.duration||3}h</span>
                        </div>
                    </div>
                    <div class="actions">${buttons}</div>
                </div>`;
            });
            list.innerHTML = html;
        });
    }

    // --- ACTIONS ---
    window.openModal = (mode, id, name, phone, date, time, guests, duration) => {
        const modal = document.getElementById('booking-modal');
        const title = document.getElementById('modal-title');
        const timeSelect = document.getElementById('m-time');

        timeSelect.innerHTML = "";
        for(let i=openTime; i<=closeTime; i++) {
            const opt = document.createElement('option');
            opt.value = i + ":00"; opt.innerText = i + ":00";
            timeSelect.appendChild(opt);
        }
        
        const today = new Date().toISOString().split('T')[0];
        document.getElementById('m-date').min = today; 

        if (mode === 'edit') {
            title.innerText = "Edit Booking";
            document.getElementById('edit-id').value = id;
            document.getElementById('m-name').value = name;
            document.getElementById('m-phone').value = phone;
            document.getElementById('m-date').value = date;
            document.getElementById('m-time').value = time;
            document.getElementById('m-guests').value = guests;
            document.getElementById('m-duration').value = duration || 3;
        } else {
            title.innerText = "New Reservation";
            document.getElementById('edit-id').value = ""; 
            document.getElementById('m-name').value = "";
            document.getElementById('m-phone').value = "";
            document.getElementById('m-date').value = today;
            document.getElementById('m-guests').value = 2;
            document.getElementById('m-duration').value = 3;
        }
        modal.style.display = 'flex';
    };

    window.closeModal = () => document.getElementById('booking-modal').style.display = 'none';

    window.saveBooking = async () => {
        const id = document.getElementById('edit-id').value;
        const name = document.getElementById('m-name').value || "Walk-in";
        const phone = document.getElementById('m-phone').value || "N/A";
        const date = document.getElementById('m-date').value;
        const time = document.getElementById('m-time').value;
        const guests = parseInt(document.getElementById('m-guests').value);
        const duration = parseInt(document.getElementById('m-duration').value);

        if(!date || !time) return alert("Date/Time required");

        // 1. DATE CHECKS
        const today = new Date(); 
        const selDate = new Date(date);
        const isToday = selDate.getDate() === today.getDate() && selDate.getMonth() === today.getMonth();
        const selHour = parseInt(time.split(':')[0]);
        const currHour = today.getHours();

        if (selDate < new Date(today.toDateString())) return alert("Past Date!");
        if (isToday && selHour < currHour) return alert("Past Time!");

        // 2. CAPACITY CHECK
        const btn = document.querySelector('#booking-modal .btn-main');
        const originalText = btn.innerText;
        btn.innerText = "Checking...";
        
        try {
            const q = query(collection(db, "reservations"), where("restaurant", "==", currentRestaurant), where("date", "==", date));
            const snapshot = await getDocs(q);
            
            let currentGuests = 0;
            snapshot.forEach(doc => {
                if(id && doc.id === id) return;
                const d = doc.data();
                if(!d.archived && d.status !== 'Declined') {
                    const startH = parseInt(d.time.split(':')[0]);
                    const endH = startH + (d.duration || 3);
                    if (selHour < endH && (selHour + duration) > startH) {
                        currentGuests += parseInt(d.persons);
                    }
                }
            });

            if (currentGuests + guests > maxGuests) {
                if (!confirm(`⚠️ WARNING: Capacity Exceeded!\nLimit: ${maxGuests}\nNew Total: ${currentGuests+guests}\n\nForce Add?`)) {
                    btn.innerText = originalText; return;
                }
            }

            if (id) {
                await updateDoc(doc(db, "reservations", id), { name, phone, date, time, persons: guests, duration: duration });
            } else {
                await addDoc(collection(db, "reservations"), { restaurant: currentRestaurant, name, phone, date, time, persons: guests, duration: duration, status: "Accepted", source: "Manager", createdAt: new Date() });
            }
            closeModal();
        } catch (e) { alert(e.message); }
        finally { btn.innerText = originalText; }
    };

    window.handleDecision = async (id, phone, name, status) => {
        await updateDoc(doc(db, "reservations", id), { status: status });
        let cleanPhone = phone.replace(/\D/g, ''); 
        if(cleanPhone.startsWith('0')) cleanPhone = "963" + cleanPhone.substring(1); 
        let message = status === "Accepted" ? `Hello ${name}, your reservation at ${currentRestaurant} is CONFIRMED! ✅` : `Hello ${name}, unfortunately we cannot accept your reservation at ${currentRestaurant}. ❌`;
        window.open(`https://wa.me/${cleanPhone}?text=${encodeURIComponent(message)}`, '_blank');
    };

    window.archiveBooking = async (id) => {
        if(confirm("Archive/Delete this booking?")) { await updateDoc(doc(db, "reservations", id), { archived: true }); }
    };
</script>
</body>
</html>
