<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Manager Portal - Tawelty</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        /* --- MODERN DASHBOARD THEME --- */
        body { font-family: 'Plus Jakarta Sans', sans-serif; background: #EEF2F5; padding: 40px 20px; color: #333; margin: 0; }
        .container { max-width: 900px; margin: 0 auto; background: white; padding: 40px; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.05); }
        
        h1, h2 { color: #2C3E50; font-weight: 700; margin-top: 0; }
        
        /* HEADER */
        .dashboard-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; border-bottom: 2px solid #f0f0f0; padding-bottom: 20px; flex-wrap: wrap; gap: 15px; }
        #manager-title { border-left: 5px solid #D4AF37; padding-left: 15px; margin: 0; }
        .controls-right { display: flex; gap: 15px; align-items: center; }

        /* LIVE STATS BOX (NEW) */
        .live-stats {
            background: #1a1a1a; color: white; padding: 15px 20px; border-radius: 12px;
            display: flex; gap: 20px; align-items: center; margin-bottom: 30px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.15);
        }
        .stat-item { text-align: center; }
        .stat-label { font-size: 11px; text-transform: uppercase; color: #aaa; letter-spacing: 1px; }
        .stat-val { font-size: 20px; font-weight: 700; color: #D4AF37; }
        .stat-limit { font-size: 14px; color: #666; font-weight: 400; color: #bbb; }

        /* STATUS TOGGLE */
        .status-control { display: flex; align-items: center; gap: 10px; }
        .switch { position: relative; display: inline-block; width: 50px; height: 28px; }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: #ccc; transition: .4s; border-radius: 34px; }
        .slider:before { position: absolute; content: ""; height: 20px; width: 20px; left: 4px; bottom: 4px; background-color: white; transition: .4s; border-radius: 50%; }
        input:checked + .slider { background-color: #27ae60; }
        input:checked + .slider:before { transform: translateX(22px); }
        .status-label { font-weight: bold; font-size: 13px; color: #666; }

        /* BUTTONS */
        button { padding: 10px 20px; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; transition: 0.2s; font-size: 14px; }
        .btn-add { background: #1a1a1a; color: white; display: flex; align-items: center; gap: 5px; }
        .btn-add:hover { background: #D4AF37; }
        .btn-logout { background: #95A5A6; color: white; }

        /* MODAL */
        .modal { display: none; position: fixed; z-index: 999; left: 0; top: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.4); backdrop-filter: blur(5px); justify-content: center; align-items: center; }
        .modal-content { background: white; padding: 30px; border-radius: 15px; width: 90%; max-width: 400px; box-shadow: 0 20px 60px rgba(0,0,0,0.2); }
        .input-group { margin-bottom: 15px; }
        .input-group label { display: block; font-size: 12px; font-weight: bold; color: #888; margin-bottom: 5px; }
        .modal-input { width: 100%; padding: 12px; border: 2px solid #eee; border-radius: 8px; box-sizing: border-box; }

        /* BOOKING CARDS */
        .booking-card { 
            background: #fff; border: 1px solid #eee; border-left: 5px solid transparent;
            padding: 25px; margin-bottom: 20px; border-radius: 12px; 
            display: flex; flex-direction: column; 
            box-shadow: 0 5px 15px rgba(0,0,0,0.02); transition: 0.2s;
            animation: slideIn 0.5s ease-out; 
        }
        @keyframes slideIn { from { opacity: 0; transform: translateY(-20px); } to { opacity: 1; transform: translateY(0); } }

        @media (min-width: 600px) { .booking-card { flex-direction: row; justify-content: space-between; align-items: center; } }
        
        .status-Pending { border-left-color: #F1C40F; background: #FFFCF2; } 
        .status-Accepted { border-left-color: #2ECC71; background: #ffffff; } 
        .status-Declined { border-left-color: #E74C3C; opacity: 0.7; } 

        .booking-info h3 { margin: 0 0 8px; font-size: 18px; color: #2C3E50; }
        .booking-info p { margin: 4px 0; color: #7f8c8d; font-size: 14px; display: flex; align-items: center; gap: 8px; }
        .badge { display: inline-block; padding: 4px 10px; border-radius: 20px; font-size: 11px; text-transform: uppercase; letter-spacing: 1px; margin-left: 10px; background: rgba(0,0,0,0.05); font-weight: 800; }

        .actions { display: flex; gap: 10px; margin-top: 15px; align-items: center; }
        @media (min-width: 600px) { .actions { margin-top: 0; } }
        .btn-accept { background: #27ae60; color: white; }
        .btn-decline { background: white; border: 1px solid #e74c3c; color: #e74c3c; }
        .btn-icon { background: none; border: 1px solid #ddd; padding: 10px; border-radius: 8px; font-size: 18px; color: #666; }
        .btn-icon:hover { background: #f0f0f0; }
        
        .hidden { display: none; }
        .error { color: #e74c3c; text-align: center; margin-top: 15px; font-size: 14px; }
        
        #login-view { max-width: 400px; padding: 50px; text-align: center; margin: 10vh auto; }
        #login-view input { width: 100%; padding: 15px; border: 2px solid #eee; border-radius: 10px; box-sizing: border-box; margin-bottom: 15px; }
        .btn-login { width: 100%; background: #2C3E50; color: white; padding: 15px; font-size: 16px; }
    </style>
</head>
<body>

    <div id="login-view" class="container">
        <h2>Manager Portal</h2>
        <input type="email" id="email" placeholder="Email Address">
        <input type="password" id="password" placeholder="Password">
        <button class="btn-login" onclick="login()">Sign In</button>
        <p id="login-msg" class="error hidden"></p>
    </div>

    <div id="dashboard-view" class="container hidden">
        <div class="dashboard-header">
            <div>
                <h2 id="manager-title">Loading...</h2>
                <div class="status-control">
                    <label class="switch">
                        <input type="checkbox" id="status-toggle" onchange="toggleStatus()">
                        <span class="slider"></span>
                    </label>
                    <span id="status-text" class="status-label">Checking...</span>
                </div>
            </div>
            
            <div class="controls-right">
                <button class="btn-add" onclick="openModal('add')">+ Add Booking</button>
                <button class="btn-logout" onclick="logout()">Logout</button>
            </div>
        </div>

        <div class="live-stats">
            <div style="flex:1;">
                <div style="font-size:14px; font-weight:bold; color:#D4AF37; margin-bottom:5px;">Currently Live</div>
                <div style="font-size:11px; color:#888;" id="current-hour-display">--:--</div>
            </div>
            <div class="stat-item">
                <div class="stat-label">Guests</div>
                <div><span id="live-guests" class="stat-val">0</span> <span id="max-guests" class="stat-limit">/ 0</span></div>
            </div>
            <div style="width:1px; height:30px; background:#333;"></div>
            <div class="stat-item">
                <div class="stat-label">Tables</div>
                <div><span id="live-tables" class="stat-val">0</span> <span id="max-tables" class="stat-limit">/ 0</span></div>
            </div>
        </div>

        <audio id="notif-sound" src="https://assets.mixkit.co/active_storage/sfx/2869/2869-preview.m4a" preload="auto"></audio>

        <div id="bookings-list">
            <p style="text-align:center; color:#888;">Connecting to Live Database...</p>
        </div>
    </div>

    <div id="booking-modal" class="modal">
        <div class="modal-content">
            <h3 id="modal-title" style="margin-top:0;">Add Booking</h3>
            
            <input type="hidden" id="edit-id"> 

            <div class="input-group">
                <label>Guest Name</label>
                <input type="text" id="m-name" class="modal-input" placeholder="Name">
            </div>
            <div class="input-group">
                <label>Phone</label>
                <input type="text" id="m-phone" class="modal-input" placeholder="Phone">
            </div>
            <div class="input-group" style="display:flex; gap:10px;">
                <div style="flex:1;">
                    <label>Date</label>
                    <input type="date" id="m-date" class="modal-input">
                </div>
                <div style="flex:1;">
                    <label>Time</label>
                    <select id="m-time" class="modal-input"></select>
                </div>
            </div>
            <div class="input-group" style="display:flex; gap:10px;">
                <div style="flex:1;">
                    <label>Guests</label>
                    <input type="number" id="m-guests" class="modal-input" value="2" min="1">
                </div>
                <div style="flex:1;">
                    <label>Duration (Hrs)</label>
                    <input type="number" id="m-duration" class="modal-input" value="3" min="1">
                </div>
            </div>

            <button onclick="saveBooking()" style="width:100%; background:#1a1a1a; color:white; margin-top:10px;">Save</button>
            <button onclick="closeModal()" style="width:100%; background:white; border:1px solid #ddd; color:#666; margin-top:10px;">Cancel</button>
        </div>
    </div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
    import { getFirestore, collection, doc, getDoc, updateDoc, addDoc, query, where, onSnapshot, getDocs } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyCIYCI18z3R0ViAQ0IRofZP9b6bjxZFCOw",
      authDomain: "tawelty-realtime.firebaseapp.com",
      projectId: "tawelty-realtime",
      storageBucket: "tawelty-realtime.firebasestorage.app",
      messagingSenderId: "127610217841",
      appId: "1:127610217841:web:9535aedf4a06c645c9c2d0"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    let currentRestaurant = "";
    let restaurantDocId = "";
    let maxGuests = 0;
    let maxTables = 0; 
    let unsubscribe = null; 

    // --- INIT ---
    window.onload = () => {
        const sel = document.getElementById('m-time');
        for(let i=12; i<=23; i++) {
            const opt = document.createElement('option');
            opt.value = i + ":00";
            opt.innerText = i + ":00";
            sel.appendChild(opt);
        }
    };

    // --- LOGIN ---
    window.login = () => {
        const email = document.getElementById('email').value;
        const pass = document.getElementById('password').value;
        signInWithEmailAndPassword(auth, email, pass).catch(e => {
            document.getElementById('login-msg').innerText = "Access Failed: " + e.message;
            document.getElementById('login-msg').classList.remove('hidden');
        });
    };
    
    window.logout = () => {
        if(unsubscribe) unsubscribe();
        signOut(auth).then(() => { window.location.href = "index.html"; });
    };

    onAuthStateChanged(auth, async (user) => {
        if (user) {
            document.getElementById('login-view').classList.add('hidden');
            document.getElementById('dashboard-view').classList.remove('hidden');
            try {
                const managerRef = doc(db, "managers", user.email);
                const managerSnap = await getDoc(managerRef);
                if (managerSnap.exists()) {
                    currentRestaurant = managerSnap.data().restaurant;
                    document.getElementById('manager-title').innerText = currentRestaurant;
                    
                    // GET RESTAURANT LIMITS
                    const q = query(collection(db, "restaurants"), where("name", "==", currentRestaurant));
                    const resSnap = await getDocs(q);
                    if(!resSnap.empty) {
                        const d = resSnap.docs[0].data();
                        restaurantDocId = resSnap.docs[0].id;
                        maxGuests = d.capacity || 20;
                        maxTables = d.tables || 10;
                        
                        document.getElementById('max-guests').innerText = "/ " + maxGuests;
                        document.getElementById('max-tables').innerText = "/ " + maxTables;
                        
                        updateToggleUI(d.isOpen !== false);
                    }
                    startRealtimeListener(); 
                } else {
                    document.getElementById('bookings-list').innerHTML = "<p style='color:red;'>Access Denied</p>";
                }
            } catch (error) { console.error(error); }
        } else {
            document.getElementById('login-view').classList.remove('hidden');
            document.getElementById('dashboard-view').classList.add('hidden');
        }
    });

    // --- MODAL LOGIC (ADD & EDIT) ---
    window.openModal = (mode, id, name, phone, date, time, guests, duration) => {
        const modal = document.getElementById('booking-modal');
        const title = document.getElementById('modal-title');
        
        if (mode === 'edit') {
            title.innerText = "Edit Booking / Extend Time";
            document.getElementById('edit-id').value = id;
            document.getElementById('m-name').value = name;
            document.getElementById('m-phone').value = phone;
            document.getElementById('m-date').value = date;
            document.getElementById('m-time').value = time;
            document.getElementById('m-guests').value = guests;
            document.getElementById('m-duration').value = duration || 3;
        } else {
            title.innerText = "Add Walk-in / Phone";
            document.getElementById('edit-id').value = ""; // Clear ID
            document.getElementById('m-name').value = "";
            document.getElementById('m-phone').value = "";
            document.getElementById('m-date').valueAsDate = new Date();
            document.getElementById('m-guests').value = 2;
            document.getElementById('m-duration').value = 3;
        }
        modal.style.display = 'flex';
    };

    window.closeModal = () => document.getElementById('booking-modal').style.display = 'none';

    window.saveBooking = async () => {
        const id = document.getElementById('edit-id').value;
        const name = document.getElementById('m-name').value || "Walk-in";
        const phone = document.getElementById('m-phone').value || "N/A";
        const date = document.getElementById('m-date').value;
        const time = document.getElementById('m-time').value;
        const guests = parseInt(document.getElementById('m-guests').value);
        const duration = parseInt(document.getElementById('m-duration').value);

        if(!date || !time) return alert("Date and Time are required.");

        try {
            if (id) {
                // UPDATE EXISTING
                await updateDoc(doc(db, "reservations", id), {
                    name, phone, date, time, persons: guests, duration: duration
                });
                alert("Booking Updated! Dashboard calculating...");
            } else {
                // CREATE NEW
                await addDoc(collection(db, "reservations"), {
                    restaurant: currentRestaurant,
                    name, phone, date, time, 
                    persons: guests, 
                    duration: duration,
                    status: "Accepted", 
                    source: "Manager",
                    createdAt: new Date()
                });
                alert("Booking Added!");
            }
            closeModal();
        } catch (e) { alert("Error: " + e.message); }
    };

    // --- LIVE STATS CALCULATOR ---
    function updateLiveStats(snapshot) {
        const now = new Date();
        const currentHour = now.getHours(); // e.g. 14 for 2:00 PM
        const todayStr = now.toISOString().split('T')[0];

        document.getElementById('current-hour-display').innerText = `Time: ${currentHour}:00 (${todayStr})`;

        let liveGuests = 0;
        let liveTables = 0;

        snapshot.forEach(doc => {
            const data = doc.data();
            // Filter: Must be TODAY and ACTIVE (Accepted/Pending/Arrived) and NOT Archived
            if (data.date === todayStr && !data.archived && data.status !== 'Declined') {
                const startHour = parseInt(data.time.split(':')[0]);
                const endHour = startHour + (data.duration || 3);

                // IS IT HAPPENING NOW?
                if (currentHour >= startHour && currentHour < endHour) {
                    liveGuests += parseInt(data.persons);
                    liveTables += Math.ceil(parseInt(data.persons) / 4);
                }
            }
        });

        document.getElementById('live-guests').innerText = liveGuests;
        document.getElementById('live-tables').innerText = liveTables;
        
        // COLOR WARNINGS
        const gEl = document.getElementById('live-guests');
        if(liveGuests >= maxGuests) gEl.style.color = "#e74c3c"; // Red
        else if (liveGuests >= maxGuests * 0.8) gEl.style.color = "#F1C40F"; // Orange
        else gEl.style.color = "#2ECC71"; // Green
    }

    // --- REAL-TIME LISTENER ---
    function startRealtimeListener() {
        if(!currentRestaurant) return;
        const list = document.getElementById('bookings-list');
        const sound = document.getElementById('notif-sound');
        
        const q = query(collection(db, "reservations"), where("restaurant", "==", currentRestaurant));
        let isFirstLoad = true;

        unsubscribe = onSnapshot(q, (snapshot) => {
            // 1. UPDATE LIVE DASHBOARD
            updateLiveStats(snapshot);

            // 2. UPDATE LIST
            if(snapshot.empty) { list.innerHTML = "<p style='text-align:center; padding:40px; color:#999;'>No active bookings.</p>"; return; }

            if (!isFirstLoad) {
                snapshot.docChanges().forEach((change) => {
                    const d = change.doc.data();
                    if (change.type === "added" && !d.archived && d.source !== "Manager") {
                        sound.currentTime = 0;
                        sound.play().catch(e => console.log("Audio blocked"));
                    }
                });
            }
            isFirstLoad = false;

            let html = '';
            // Sort by Date then Time? For now just simple render
            snapshot.docs.forEach(docSnap => {
                const b = docSnap.data();
                if(b.archived === true) return; 
                
                let buttons = '';
                if(b.status === 'Pending') {
                    buttons = `
                        <button class="btn-accept" onclick="handleDecision('${docSnap.id}', '${b.phone}', '${b.name}', 'Accepted')">Accept & WhatsApp 🟢</button>
                        <button class="btn-decline" onclick="handleDecision('${docSnap.id}', '${b.phone}', '${b.name}', 'Declined')">Decline & WhatsApp 🔴</button>
                    `;
                } else {
                    buttons = `<span style="color:#999; font-size:12px; font-weight:bold; margin-right:10px;">${b.status}</span>`;
                }
                
                const safeName = b.name.replace(/'/g, "\\'");
                const safePhone = (b.phone || "").replace(/'/g, "\\'");
                const dur = b.duration || 3;

                buttons += `
                    <button class="btn-icon" title="Edit / Extend" onclick="openModal('edit', '${docSnap.id}', '${safeName}', '${safePhone}', '${b.date}', '${b.time}', ${b.persons}, ${dur})">✏️</button>
                    <button class="btn-icon" title="Finished / Archive" onclick="archiveBooking('${docSnap.id}')">🗑️</button>
                `;

                const sourceTag = b.source === "Manager" ? '<span style="color:#D4AF37; font-size:10px;">(Manual)</span>' : '';

                html += `
                <div class="booking-card status-${b.status}">
                    <div class="booking-info">
                        <h3>${b.name} ${sourceTag} <span class="badge" style="background:${b.status=='Accepted'?'#2ECC71':(b.status=='Pending'?'#F1C40F':'#E74C3C')}; color:white;">${b.status}</span></h3>
                        <p>📅 ${b.date} | ⏰ ${b.time} | ⏳ ${dur} Hrs</p>
                        <p>👥 ${b.persons} Guests | 📞 ${b.phone}</p>
                    </div>
                    <div class="actions">${buttons}</div>
                </div>`;
            });
            list.innerHTML = html;
        });
    }

    // --- OTHER ACTIONS ---
    window.handleDecision = async (id, phone, name, status) => {
        await updateDoc(doc(db, "reservations", id), { status: status });
        let cleanPhone = phone.replace(/\D/g, ''); 
        if(cleanPhone.startsWith('0')) cleanPhone = "963" + cleanPhone.substring(1); 
        let message = status === "Accepted" ? `Hello ${name}, your reservation at ${currentRestaurant} is CONFIRMED! ✅` : `Hello ${name}, unfortunately we cannot accept your reservation at ${currentRestaurant}. ❌`;
        window.open(`https://wa.me/${cleanPhone}?text=${encodeURIComponent(message)}`, '_blank');
    };

    window.archiveBooking = async (id) => {
        if(confirm("Archive this booking? (This will free up the table)")) {
            await updateDoc(doc(db, "reservations", id), { archived: true });
        }
    };
    
    window.toggleStatus = async () => {
        if(!restaurantDocId) return;
        const toggle = document.getElementById('status-toggle');
        const isNowOpen = toggle.checked;
        updateToggleUI(isNowOpen); 
        const resRef = doc(db, "restaurants", restaurantDocId);
        await updateDoc(resRef, { isOpen: isNowOpen });
    };

    function updateToggleUI(isOpen) {
        const toggle = document.getElementById('status-toggle');
        const label = document.getElementById('status-text');
        toggle.checked = isOpen;
        if(isOpen) { label.innerText = "🟢 Accepting Orders"; label.style.color = "#27ae60"; } 
        else { label.innerText = "🔴 Kitchen Busy (Closed)"; label.style.color = "#e74c3c"; }
    }
</script>
</body>
</html>
