<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Manager Portal - Tawelty</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        /* --- MODERN DASHBOARD THEME --- */
        body { font-family: 'Plus Jakarta Sans', sans-serif; background: #EEF2F5; padding: 40px 20px; color: #333; margin: 0; }
        .container { max-width: 900px; margin: 0 auto; background: white; padding: 40px; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.05); }
        
        h1, h2 { color: #2C3E50; font-weight: 700; margin-top: 0; }
        
        /* HEADER & TOGGLE */
        .dashboard-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; border-bottom: 2px solid #f0f0f0; padding-bottom: 20px; }
        #manager-title { border-left: 5px solid #D4AF37; padding-left: 15px; margin: 0; }

        /* The Switch Box */
        .status-control { display: flex; align-items: center; gap: 10px; }
        .switch { position: relative; display: inline-block; width: 60px; height: 34px; }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: #ccc; transition: .4s; border-radius: 34px; }
        .slider:before { position: absolute; content: ""; height: 26px; width: 26px; left: 4px; bottom: 4px; background-color: white; transition: .4s; border-radius: 50%; }
        input:checked + .slider { background-color: #27ae60; } /* Green when Open */
        input:checked + .slider:before { transform: translateX(26px); }
        .status-label { font-weight: bold; font-size: 14px; color: #666; }

        /* Input Fields */
        input[type="email"], input[type="password"] { width: 100%; padding: 15px; border: 2px solid #eee; border-radius: 10px; box-sizing: border-box; margin-bottom: 15px; font-size: 16px; transition: 0.3s; }
        input:focus { border-color: #2C3E50; outline: none; background: #fafafa; }
        
        /* Buttons */
        button { padding: 12px 25px; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; transition: 0.2s; font-size: 14px; }
        .btn-logout { background: #95A5A6; color: white; margin-left: 20px; }

        /* Login Box */
        #login-view { max-width: 400px; padding: 50px; text-align: center; margin: 10vh auto; }
        .btn-login { width: 100%; background: #2C3E50; color: white; font-size: 16px; padding: 15px; margin-top: 10px; }

        /* Booking Cards */
        .booking-card { 
            background: #fff; border: 1px solid #eee; border-left: 5px solid transparent;
            padding: 25px; margin-bottom: 20px; border-radius: 12px; 
            display: flex; flex-direction: column; 
            box-shadow: 0 5px 15px rgba(0,0,0,0.02); transition: 0.2s;
            animation: slideIn 0.5s ease-out; 
        }
        @keyframes slideIn { from { opacity: 0; transform: translateY(-20px); } to { opacity: 1; transform: translateY(0); } }

        @media (min-width: 600px) { .booking-card { flex-direction: row; justify-content: space-between; align-items: center; } }
        
        .status-Pending { border-left-color: #F1C40F; background: #FFFCF2; } 
        .status-Accepted { border-left-color: #2ECC71; background: #ffffff; } 
        .status-Declined { border-left-color: #E74C3C; opacity: 0.7; } 

        .booking-info h3 { margin: 0 0 8px; font-size: 18px; color: #2C3E50; }
        .booking-info p { margin: 4px 0; color: #7f8c8d; font-size: 14px; display: flex; align-items: center; gap: 8px; }
        .badge { display: inline-block; padding: 4px 10px; border-radius: 20px; font-size: 11px; text-transform: uppercase; letter-spacing: 1px; margin-left: 10px; background: rgba(0,0,0,0.05); font-weight: 800; }

        /* Actions */
        .actions { display: flex; gap: 10px; margin-top: 15px; align-items: center; }
        @media (min-width: 600px) { .actions { margin-top: 0; } }
        .btn-accept { background: #27ae60; color: white; }
        .btn-decline { background: white; border: 1px solid #e74c3c; color: #e74c3c; }
        .btn-archive { background: none; border: 1px solid #ddd; padding: 10px; border-radius: 8px; font-size: 18px; color: #999; }
        
        .hidden { display: none; }
        .error { color: #e74c3c; text-align: center; margin-top: 15px; font-size: 14px; }
    </style>
</head>
<body>

    <div id="login-view" class="container">
        <h2>Manager Portal</h2>
        <input type="email" id="email" placeholder="Email Address">
        <input type="password" id="password" placeholder="Password">
        <button class="btn-login" onclick="login()">Sign In</button>
        <p id="login-msg" class="error hidden"></p>
    </div>

    <div id="dashboard-view" class="container hidden">
        <div class="dashboard-header">
            <div>
                <h2 id="manager-title">Loading...</h2>
                <div class="status-control">
                    <label class="switch">
                        <input type="checkbox" id="status-toggle" onchange="toggleStatus()">
                        <span class="slider"></span>
                    </label>
                    <span id="status-text" class="status-label">Checking Status...</span>
                </div>
            </div>
            <button class="btn-logout" onclick="logout()">Logout</button>
        </div>

        <audio id="notif-sound" src="https://assets.mixkit.co/active_storage/sfx/2869/2869-preview.m4a" preload="auto"></audio>

        <div id="bookings-list">
            <p style="text-align:center; color:#888;">Connecting to Live Database...</p>
        </div>
    </div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
    import { getFirestore, collection, doc, getDoc, updateDoc, query, where, onSnapshot, getDocs } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyCIYCI18z3R0ViAQ0IRofZP9b6bjxZFCOw",
      authDomain: "tawelty-realtime.firebaseapp.com",
      projectId: "tawelty-realtime",
      storageBucket: "tawelty-realtime.firebasestorage.app",
      messagingSenderId: "127610217841",
      appId: "1:127610217841:web:9535aedf4a06c645c9c2d0"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    let currentRestaurant = "";
    let restaurantDocId = ""; // To store the exact ID of the restaurant doc
    let unsubscribe = null; 

    // --- LOGIN ---
    window.login = () => {
        const email = document.getElementById('email').value;
        const pass = document.getElementById('password').value;
        signInWithEmailAndPassword(auth, email, pass).catch(e => {
            document.getElementById('login-msg').innerText = "Access Failed: " + e.message;
            document.getElementById('login-msg').classList.remove('hidden');
        });
    };
    
    window.logout = () => {
        if(unsubscribe) unsubscribe();
        signOut(auth).then(() => { window.location.href = "index.html"; });
    };

    // --- AUTH MONITOR ---
    onAuthStateChanged(auth, async (user) => {
        if (user) {
            document.getElementById('login-view').classList.add('hidden');
            document.getElementById('dashboard-view').classList.remove('hidden');
            
            try {
                // 1. Get Manager Info
                const managerRef = doc(db, "managers", user.email);
                const managerSnap = await getDoc(managerRef);

                if (managerSnap.exists()) {
                    currentRestaurant = managerSnap.data().restaurant;
                    document.getElementById('manager-title').innerText = currentRestaurant;
                    
                    // 2. Find the Restaurant Document (To control 'isOpen' status)
                    const q = query(collection(db, "restaurants"), where("name", "==", currentRestaurant));
                    const resSnap = await getDocs(q);
                    if(!resSnap.empty) {
                        const resDoc = resSnap.docs[0];
                        restaurantDocId = resDoc.id;
                        // Set Toggle State
                        const isOpen = resDoc.data().isOpen !== false; // Default to true if missing
                        updateToggleUI(isOpen);
                    }

                    startRealtimeListener(); 
                } else {
                    document.getElementById('bookings-list').innerHTML = "<p style='color:red;'>Access Denied</p>";
                }
            } catch (error) { console.error(error); }

        } else {
            document.getElementById('login-view').classList.remove('hidden');
            document.getElementById('dashboard-view').classList.add('hidden');
        }
    });

    // --- STATUS TOGGLE LOGIC ---
    window.toggleStatus = async () => {
        if(!restaurantDocId) return;
        
        const toggle = document.getElementById('status-toggle');
        const isNowOpen = toggle.checked;
        
        updateToggleUI(isNowOpen); // Update Text immediately
        
        // Update Firebase
        const resRef = doc(db, "restaurants", restaurantDocId);
        await updateDoc(resRef, { isOpen: isNowOpen });
    };

    function updateToggleUI(isOpen) {
        const toggle = document.getElementById('status-toggle');
        const label = document.getElementById('status-text');
        
        toggle.checked = isOpen;
        if(isOpen) {
            label.innerText = "🟢 Accepting Orders";
            label.style.color = "#27ae60";
        } else {
            label.innerText = "🔴 Kitchen Busy (Closed)";
            label.style.color = "#e74c3c";
        }
    }

    // --- REAL-TIME BOOKINGS ---
    function startRealtimeListener() {
        if(!currentRestaurant) return;
        const list = document.getElementById('bookings-list');
        const sound = document.getElementById('notif-sound');
        
        const q = query(collection(db, "reservations"), where("restaurant", "==", currentRestaurant));
        let isFirstLoad = true;

        unsubscribe = onSnapshot(q, (snapshot) => {
            if(snapshot.empty) { list.innerHTML = "<p style='text-align:center; padding:40px; color:#999;'>No active bookings.</p>"; return; }

            if (!isFirstLoad) {
                snapshot.docChanges().forEach((change) => {
                    if (change.type === "added" && !change.doc.data().archived) {
                        sound.currentTime = 0;
                        sound.play().catch(e => console.log("Audio blocked"));
                    }
                });
            }
            isFirstLoad = false;

            let html = '';
            let visibleCount = 0;

            snapshot.forEach(docSnap => {
                const b = docSnap.data();
                if(b.archived === true) return; 
                visibleCount++;
                
                let buttons = '';
                if(b.status === 'Pending') {
                    buttons = `
                        <button class="btn-accept" onclick="handleDecision('${docSnap.id}', '${b.phone}', '${b.name}', 'Accepted')">Accept & WhatsApp 🟢</button>
                        <button class="btn-decline" onclick="handleDecision('${docSnap.id}', '${b.phone}', '${b.name}', 'Declined')">Decline & WhatsApp 🔴</button>
                    `;
                } else {
                    buttons = `<span style="color:#999; font-size:12px; font-weight:bold; margin-right:10px;">Action Taken</span>`;
                }
                buttons += `<button class="btn-archive" onclick="archiveBooking('${docSnap.id}')" title="Archive">🗑️</button>`;

                html += `
                <div class="booking-card status-${b.status}">
                    <div class="booking-info">
                        <h3>${b.name} <span class="badge" style="background:${b.status=='Accepted'?'#2ECC71':(b.status=='Pending'?'#F1C40F':'#E74C3C')}; color:white;">${b.status}</span></h3>
                        <p>📅 ${b.date} | ⏰ ${b.time}</p>
                        <p>👥 ${b.persons} Guests | 📞 ${b.phone}</p>
                    </div>
                    <div class="actions">${buttons}</div>
                </div>`;
            });

            if(visibleCount === 0) list.innerHTML = "<p style='text-align:center; padding:40px; color:#999;'>No active bookings.</p>";
            else list.innerHTML = html;
        });
    }

    window.handleDecision = async (id, phone, name, status) => {
        const ref = doc(db, "reservations", id);
        await updateDoc(ref, { status: status });
        let cleanPhone = phone.replace(/\D/g, ''); 
        if(cleanPhone.startsWith('0')) cleanPhone = "963" + cleanPhone.substring(1); 
        let message = status === "Accepted" ? `Hello ${name}, your reservation at ${currentRestaurant} is CONFIRMED! ✅` : `Hello ${name}, unfortunately we cannot accept your reservation at ${currentRestaurant}. ❌`;
        window.open(`https://wa.me/${cleanPhone}?text=${encodeURIComponent(message)}`, '_blank');
    };

    window.archiveBooking = async (id) => {
        if(confirm("Archive this booking?")) {
            await updateDoc(doc(db, "reservations", id), { archived: true });
        }
    };
</script>
</body>
</html>
